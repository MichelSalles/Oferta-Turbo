<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Oferta Turbo</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #0d0d0d;
      color: #fff;

      min-height: 100vh;

      padding: 24px 16px 60px;
    }

    .container {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
    }

    .logo {
      width: 58px;
      height: 58px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 18px;

      font-size: 30px;

      background:
        linear-gradient(
          135deg,
          #ff9d2e,
          #ff5e22
        );
    }

    .header h1 {
      font-size: 30px;
      line-height: 1;
      margin-bottom: 7px;
    }

    .header p {
      color: #a8a8a8;
      font-size: 15px;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;

      padding: 6px;

      border-radius: 16px;

      background: #171717;

      margin-bottom: 16px;
    }

    .tab {
      border: 0;
      border-radius: 12px;

      padding: 13px;

      color: #aaa;
      background: transparent;

      font-size: 15px;
      font-weight: 600;

      cursor: pointer;
    }

    .tab.active {
      background: #ff7a00;
      color: #111;
    }

    .card {
      background: #171717;

      border: 1px solid #2b2b2b;
      border-radius: 22px;

      padding: 20px;
    }

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;

      margin-bottom: 8px;

      color: #d8d8d8;
      font-size: 14px;
    }

    input,
    select,
    textarea {
      width: 100%;

      border: 1px solid #353535;
      outline: none;

      border-radius: 14px;

      padding: 15px;

      background: #0d0d0d;
      color: #fff;

      font-size: 16px;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #ff7a00;
    }

    textarea {
      resize: vertical;
      min-height: 90px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .lookup-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }

    .lookup-button {
      border: 0;
      border-radius: 14px;

      padding: 0 18px;

      background: #3483fa;
      color: #fff;

      font-weight: 700;
      font-size: 15px;

      cursor: pointer;
    }

    .lookup-button:disabled {
      opacity: 0.55;
    }

    .status {
      display: none;

      margin-top: 10px;

      font-size: 14px;
    }

    .status.show {
      display: block;
    }

    .status.success {
      color: #3ddc84;
    }

    .status.error {
      color: #ff6464;
    }

    .product-preview {
      display: none;

      gap: 14px;
      align-items: center;

      margin: 16px 0 22px;

      padding: 12px;

      background: #101010;

      border: 1px solid #2d2d2d;
      border-radius: 16px;
    }

    .product-preview.show {
      display: flex;
    }

    .product-preview img {
      width: 90px;
      height: 90px;

      border-radius: 12px;
      object-fit: contain;

      background: #fff;
    }

    .product-preview-info {
      min-width: 0;
    }

    .product-preview-title {
      font-size: 14px;
      font-weight: 700;

      line-height: 1.35;

      margin-bottom: 8px;
    }

    .product-preview-price {
      font-size: 20px;
      color: #3ddc84;
      font-weight: 800;
    }

    .discount {
      margin-left: 6px;

      color: #3ddc84;
      font-size: 13px;
      font-weight: 700;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;

      gap: 10px;

      margin-top: 8px;
    }

    .button {
      border: 0;
      border-radius: 14px;

      padding: 15px;

      font-size: 16px;
      font-weight: 800;

      cursor: pointer;
    }

    .primary {
      background: #ff7a00;
      color: #111;
    }

    .secondary {
      background: #303030;
      color: #fff;
    }

    .preview-card {
      margin-top: 16px;

      padding: 20px;

      background: #171717;

      border: 1px solid #2b2b2b;
      border-radius: 22px;
    }

    .preview-label {
      color: #888;

      font-size: 12px;
      font-weight: 700;

      margin-bottom: 12px;
    }

    #messagePreview {
      white-space: pre-wrap;

      line-height: 1.5;

      font-size: 15px;
    }

    .copy-button {
      width: 100%;

      margin-top: 16px;

      border: 0;
      border-radius: 14px;

      padding: 14px;

      background: #25d366;
      color: #071b0e;

      font-size: 16px;
      font-weight: 800;

      cursor: pointer;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 520px) {
      .row {
        grid-template-columns: 1fr;
      }

      .actions {
        grid-template-columns: 1fr;
      }

      .lookup-row {
        grid-template-columns: 1fr;
      }

      .lookup-button {
        padding: 14px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">

      <div class="logo">
        ⚡
      </div>

      <div>
        <h1>
          Oferta Turbo
        </h1>

        <p>
          Gerador rápido de ofertas para WhatsApp
        </p>
      </div>

    </div>


    <div class="tabs">

      <button
        id="amazonTab"
        class="tab active"
        onclick="changePlatform('amazon')"
      >
        Amazon
      </button>

      <button
        id="meliTab"
        class="tab"
        onclick="changePlatform('meli')"
      >
        Mercado Livre
      </button>

    </div>


    <div class="card">

      <div class="field">

        <label id="linkLabel">
          Link de afiliado Amazon
        </label>

        <div
          id="amazonLinkContainer"
        >

          <input
            id="amazonLink"
            type="url"
            placeholder="https://amzn.to/..."
          />

        </div>


        <div
          id="meliLinkContainer"
          class="hidden"
        >

          <div class="lookup-row">

            <input
              id="meliLink"
              type="url"
              placeholder="https://meli.la/..."
            />

            <button
              id="lookupButton"
              class="lookup-button"
              onclick="buscarMercadoLivre()"
            >
              🔎 Buscar
            </button>

          </div>

          <div
            id="lookupStatus"
            class="status"
          ></div>

        </div>

      </div>


      <div
        id="productPreview"
        class="product-preview"
      >

        <img
          id="productImage"
          src=""
          alt="Produto"
        />

        <div class="product-preview-info">

          <div
            id="productPreviewTitle"
            class="product-preview-title"
          ></div>

          <div>

            <span
              id="productPreviewPrice"
              class="product-preview-price"
            ></span>

            <span
              id="productPreviewDiscount"
              class="discount"
            ></span>

          </div>

        </div>

      </div>


      <div class="field">

        <label>
          Produto
        </label>

        <input
          id="product"
          type="text"
          placeholder="Ex.: Echo Dot 5ª geração"
        />

      </div>


      <div class="row">

        <div class="field">

          <label>
            Preço atual
          </label>

          <input
            id="price"
            type="text"
            inputmode="decimal"
            placeholder="199,90"
          />

        </div>


        <div class="field">

          <label>
            Preço anterior
          </label>

          <input
            id="oldPrice"
            type="text"
            inputmode="decimal"
            placeholder="349,90"
          />

        </div>

      </div>


      <div class="row">

        <div class="field">

          <label>
            Categoria
          </label>

          <select id="category">

            <option>
              Eletrônicos
            </option>

            <option>
              Informática
            </option>

            <option>
              Casa e cozinha
            </option>

            <option>
              Ferramentas
            </option>

            <option>
              Beleza
            </option>

            <option>
              Games
            </option>

            <option>
              Celulares
            </option>

            <option>
              Outros
            </option>

          </select>

        </div>


        <div class="field">

          <label>
            Cupom (opcional)
          </label>

          <input
            id="coupon"
            type="text"
            placeholder="Ex.: TURBO20"
          />

        </div>

      </div>


      <div class="field">

        <label>
          Observação (opcional)
        </label>

        <input
          id="note"
          type="text"
          placeholder="Ex.: Frete grátis"
        />

      </div>


      <div class="actions">

        <button
          class="button primary"
          onclick="generateOffer()"
        >
          ⚡ Gerar oferta
        </button>

        <button
          class="button secondary"
          onclick="clearForm()"
        >
          Limpar
        </button>

      </div>

    </div>


    <div class="preview-card">

      <div class="preview-label">
        PRÉVIA DA MENSAGEM
      </div>

      <div id="messagePreview">
        Preencha os dados e toque em “Gerar oferta”.
      </div>

      <button
        id="copyButton"
        class="copy-button hidden"
        onclick="copyMessage()"
      >
        📋 Copiar mensagem
      </button>

    </div>

  </div>


<script>

let platform = "amazon";

let mercadoLivreData = null;


function changePlatform(newPlatform) {

  platform = newPlatform;

  const amazonTab =
    document.getElementById("amazonTab");

  const meliTab =
    document.getElementById("meliTab");

  const amazonLinkContainer =
    document.getElementById(
      "amazonLinkContainer"
    );

  const meliLinkContainer =
    document.getElementById(
      "meliLinkContainer"
    );

  const label =
    document.getElementById(
      "linkLabel"
    );


  if (platform === "amazon") {

    amazonTab.classList.add(
      "active"
    );

    meliTab.classList.remove(
      "active"
    );

    amazonLinkContainer.classList.remove(
      "hidden"
    );

    meliLinkContainer.classList.add(
      "hidden"
    );

    label.textContent =
      "Link de afiliado Amazon";

  } else {

    meliTab.classList.add(
      "active"
    );

    amazonTab.classList.remove(
      "active"
    );

    meliLinkContainer.classList.remove(
      "hidden"
    );

    amazonLinkContainer.classList.add(
      "hidden"
    );

    label.textContent =
      "Link de afiliado Mercado Livre";

  }

}


function setStatus(
  text,
  type
) {

  const status =
    document

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Oferta Turbo</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #0d0d0d;
      color: #fff;

      min-height: 100vh;
      padding: 24px 16px 60px;
    }

    .container {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
    }

    .logo {
      width: 58px;
      height: 58px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 18px;
      font-size: 30px;

      background:
        linear-gradient(
          135deg,
          #ff9d2e,
          #ff5e22
        );
    }

    .header h1 {
      font-size: 30px;
      line-height: 1;
      margin-bottom: 7px;
    }

    .header p {
      color: #a8a8a8;
      font-size: 15px;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;

      padding: 6px;
      border-radius: 16px;
      background: #171717;

      margin-bottom: 16px;
    }

    .tab {
      border: 0;
      border-radius: 12px;
      padding: 13px;

      color: #aaa;
      background: transparent;

      font-size: 15px;
      font-weight: 600;

      cursor: pointer;
      touch-action: manipulation;
    }

    .tab.active {
      background: #ff7a00;
      color: #111;
    }

    .card {
      background: #171717;

      border: 1px solid #2b2b2b;
      border-radius: 22px;

      padding: 20px;
    }

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;
      margin-bottom: 8px;

      color: #d8d8d8;
      font-size: 14px;
    }

    input,
    select,
    textarea {
      width: 100%;

      border: 1px solid #353535;
      outline: none;

      border-radius: 14px;
      padding: 15px;

      background: #0d0d0d;
      color: #fff;

      font-size: 16px;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #ff7a00;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .lookup-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }

    .lookup-button {
      border: 0;
      border-radius: 14px;

      padding: 0 18px;

      background: #3483fa;
      color: #fff;

      font-weight: 700;
      font-size: 15px;

      cursor: pointer;
      touch-action: manipulation;
    }

    .lookup-button:disabled {
      opacity: 0.55;
    }

    .status {
      display: none;
      margin-top: 10px;
      font-size: 14px;
    }

    .status.show {
      display: block;
    }

    .status.success {
      color: #3ddc84;
    }

    .status.error {
      color: #ff6464;
    }

    .product-preview {
      display: none;

      gap: 14px;
      align-items: center;

      margin: 16px 0 22px;
      padding: 12px;

      background: #101010;

      border: 1px solid #2d2d2d;
      border-radius: 16px;
    }

    .product-preview.show {
      display: flex;
    }

    .product-preview img {
      width: 90px;
      height: 90px;

      border-radius: 12px;
      object-fit: contain;

      background: #fff;
    }

    .product-preview-info {
      min-width: 0;
    }

    .product-preview-title {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: 8px;
    }

    .product-preview-price {
      font-size: 20px;
      color: #3ddc84;
      font-weight: 800;
    }

    .discount {
      margin-left: 6px;

      color: #3ddc84;
      font-size: 13px;
      font-weight: 700;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;

      gap: 10px;
      margin-top: 8px;
    }

    .button {
      border: 0;
      border-radius: 14px;

      padding: 15px;

      font-size: 16px;
      font-weight: 800;

      cursor: pointer;
      touch-action: manipulation;
    }

    .primary {
      background: #ff7a00;
      color: #111;
    }

    .secondary {
      background: #303030;
      color: #fff;
    }

    .preview-card {
      margin-top: 16px;
      padding: 20px;

      background: #171717;

      border: 1px solid #2b2b2b;
      border-radius: 22px;
    }

    .preview-label {
      color: #888;

      font-size: 12px;
      font-weight: 700;

      margin-bottom: 12px;
    }

    #messagePreview {
      white-space: pre-wrap;
      line-height: 1.5;
      font-size: 15px;
    }

    .copy-button {
      width: 100%;
      margin-top: 16px;

      border: 0;
      border-radius: 14px;

      padding: 14px;

      background: #25d366;
      color: #071b0e;

      font-size: 16px;
      font-weight: 800;

      cursor: pointer;
      touch-action: manipulation;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 520px) {
      .row {
        grid-template-columns: 1fr;
      }

      .actions {
        grid-template-columns: 1fr;
      }

      .lookup-row {
        grid-template-columns: 1fr;
      }

      .lookup-button {
        padding: 14px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">

    <div class="logo">
      ⚡
    </div>

    <div>
      <h1>Oferta Turbo</h1>

      <p>
        Gerador rápido de ofertas para WhatsApp
      </p>
    </div>

  </div>


  <div class="tabs">

    <button
      id="amazonTab"
      class="tab active"
      type="button"
    >
      Amazon
    </button>

    <button
      id="meliTab"
      class="tab"
      type="button"
    >
      Mercado Livre
    </button>

  </div>


  <div class="card">

    <div class="field">

      <label id="linkLabel">
        Link de afiliado Amazon
      </label>


      <div id="amazonLinkContainer">

        <input
          id="amazonLink"
          type="url"
          placeholder="https://amzn.to/..."
        />

      </div>


      <div
        id="meliLinkContainer"
        class="hidden"
      >

        <div class="lookup-row">

          <input
            id="meliLink"
            type="url"
            placeholder="https://meli.la/..."
          />

          <button
            id="lookupButton"
            class="lookup-button"
            type="button"
          >
            🔎 Buscar
          </button>

        </div>

        <div
          id="lookupStatus"
          class="status"
        ></div>

      </div>

    </div>


    <div
      id="productPreview"
      class="product-preview"
    >

      <img
        id="productImage"
        src=""
        alt="Produto"
      />

      <div class="product-preview-info">

        <div
          id="productPreviewTitle"
          class="product-preview-title"
        ></div>

        <div>

          <span
            id="productPreviewPrice"
            class="product-preview-price"
          ></span>

          <span
            id="productPreviewDiscount"
            class="discount"
          ></span>

        </div>

      </div>

    </div>


    <div class="field">

      <label>
        Produto
      </label>

      <input
        id="product"
        type="text"
        placeholder="Ex.: Echo Dot 5ª geração"
      />

    </div>


    <div class="row">

      <div class="field">

        <label>
          Preço atual
        </label>

        <input
          id="price"
          type="text"
          inputmode="decimal"
          placeholder="199,90"
        />

      </div>


      <div class="field">

        <label>
          Preço anterior
        </label>

        <input
          id="oldPrice"
          type="text"
          inputmode="decimal"
          placeholder="349,90"
        />

      </div>

    </div>


    <div class="row">

      <div class="field">

        <label>
          Categoria
        </label>

        <select id="category">

          <option>Eletrônicos</option>
          <option>Informática</option>
          <option>Casa e cozinha</option>
          <option>Ferramentas</option>
          <option>Beleza</option>
          <option>Games</option>
          <option>Celulares</option>
          <option>Outros</option>

        </select>

      </div>


      <div class="field">

        <label>
          Cupom (opcional)
        </label>

        <input
          id="coupon"
          type="text"
          placeholder="Ex.: TURBO20"
        />

      </div>

    </div>


    <div class="field">

      <label>
        Observação (opcional)
      </label>

      <input
        id="note"
        type="text"
        placeholder="Ex.: Frete grátis"
      />

    </div>


    <div class="actions">

      <button
        id="generateButton"
        class="button primary"
        type="button"
      >
        ⚡ Gerar oferta
      </button>

      <button
        id="clearButton"
        class="button secondary"
        type="button"
      >
        Limpar
      </button>

    </div>

  </div>


  <div class="preview-card">

    <div class="preview-label">
      PRÉVIA DA MENSAGEM
    </div>

    <div id="messagePreview">
      Preencha os dados e toque em “Gerar oferta”.
    </div>

    <button
      id="copyButton"
      class="copy-button hidden"
      type="button"
    >
      📋 Copiar mensagem
    </button>

  </div>

</div>


<script>
document.addEventListener(
  "DOMContentLoaded",
  function () {

    let platform =
      "amazon";

    let mercadoLivreData =
      null;


    const amazonTab =
      document.getElementById(
        "amazonTab"
      );

    const meliTab =
      document.getElementById(
        "meliTab"
      );

    const amazonLinkContainer =
      document.getElementById(
        "amazonLinkContainer"
      );

    const meliLinkContainer =
      document.getElementById(
        "meliLinkContainer"
      );

    const linkLabel =
      document.getElementById(
        "linkLabel"
      );

    const lookupButton =
      document.getElementById(
        "lookupButton"
      );

    const generateButton =
      document.getElementById(
        "generateButton"
      );

    const clearButton =
      document.getElementById(
        "clearButton"
      );

    const copyButton =
      document.getElementById(
        "copyButton"
      );


    function changePlatform(
      newPlatform
    ) {

      platform =
        newPlatform;


      if (
        newPlatform === "amazon"
      ) {

        amazonTab.classList.add(
          "active"
        );

        meliTab.classList.remove(
          "active"
        );

        amazonLinkContainer.classList.remove(
          "hidden"
        );

        meliLinkContainer.classList.add(
          "hidden"
        );

        linkLabel.textContent =
          "Link de afiliado Amazon";

      } else {

        meliTab.classList.add(
          "active"
        );

        amazonTab.classList.remove(
          "active"
        );

        meliLinkContainer.classList.remove(
          "hidden"
        );

        amazonLinkContainer.classList.add(
          "hidden"
        );

        linkLabel.textContent =
          "Link de afiliado Mercado Livre";

      }

    }


    function setStatus(
      text,
      type
    ) {

      const status =
        document.getElementById(
          "lookupStatus"
        );

      status.textContent =
        text;

      status.className =
        `status show ${type}`;

    }


    function formatMoney(
      value
    ) {

      if (
        value === null ||
        value === undefined ||
        value === ""
      ) {

        return "";

      }


      const number =
        Number(value);


      if (
        !Number.isFinite(
          number
        )
      ) {

        return "";

      }


      return number.toLocaleString(
        "pt-BR",
        {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        }
      );

    }


    function parseMoney(
      value
    ) {

      if (!value) {

        return null;

      }


      let text =
        String(value)
          .trim()
          .replace(
            /[R$\s]/g,
            ""
          );


      if (
        text.includes(".") &&
        text.includes(",")
      ) {

        text =
          text
            .replace(
              /\./g,
              ""
            )
            .replace(
              ",",
              "."
            );

      } else if (
        text.includes(",")
      ) {

        text =
          text.replace(
            ",",
            "."
          );

      }


      const number =
        Number(text);


      return Number.isFinite(
        number
      )
        ? number
        : null;

    }


    function detectarCategoria(
      title
    ) {

      const text =
        String(
          title || ""
        ).toLowerCase();


      const groups = [
        {
          category:
            "Celulares",

          words: [
            "iphone",
            "smartphone",
            "celular",
            "capinha",
            "capa iphone",
            "carregador celular",
            "película",
            "pelicula",
            "magsafe",
          ],
        },

        {
          category:
            "Informática",

          words: [
            "notebook",
            "laptop",
            "mouse",
            "teclado",
            "monitor",
            "ssd",
            "memória ram",
            "memoria ram",
            "placa de vídeo",
            "placa de video",
            "processador",
            "roteador",
            "impressora",
            "headset gamer",
          ],
        },

        {
          category:
            "Games",

          words: [
            "playstation",
            "ps5",
            "xbox",
            "nintendo",
            "controle",
            "joystick",
            "videogame",
            "game",
          ],
        },

        {
          category:
            "Casa e cozinha",

          words: [
            "air fryer",
            "cafeteira",
            "panela",
            "liquidificador",
            "microondas",
            "micro-ondas",
            "aspirador",
            "ventilador",
            "geladeira",
            "cozinha",
            "casa",
            "churrasqueira",
          ],
        },

        {
          category:
            "Ferramentas",

          words: [
            "furadeira",
            "parafusadeira",
            "serra",
            "chave de impacto",
            "compressor",
            "ferramenta",
            "esmerilhadeira",
            "martelete",
          ],
        },

        {
          category:
            "Beleza",

          words: [
            "perfume",
            "shampoo",
            "condicionador",
            "creme",
            "maquiagem",
            "secador",
            "chapinha",
            "barbeador",
            "hidratante",
            "protetor solar",
          ],
        },

        {
          category:
            "Eletrônicos",

          words: [
            "fone",
            "bluetooth",
            "echo dot",
            "alexa",
            "smart tv",
            "televisão",
            "televisao",
            "caixa de som",
            "speaker",
            "smartwatch",
            "fone de ouvido",
          ],
        },
      ];


      for (
        const group of groups
      ) {

        for (
          const word of group.words
        ) {

          if (
            text.includes(
              word
            )
          ) {

            return group.category;

          }

        }

      }


      return "Outros";

    }


    function preencherCategoria(
      title
    ) {

      const category =
        detectarCategoria(
          title
        );


      const select =
        document.getElementById(
          "category"
        );


      const exists =
        Array.from(
          select.options
        ).some(
          function (
            option
          ) {

            return (
              option.value ===
              category
            );

          }
        );


      if (exists) {

        select.value =
          category;

      } else {

        select.value =
          "Outros";

      }

    }


    async function buscarMercadoLivre() {

      const link =
        document
          .getElementById(
            "meliLink"
          )
          .value
          .trim();


      if (!link) {

        setStatus(
          "Cole um link do Mercado Livre.",
          "error"
        );

        return;

      }


      lookupButton.disabled =
        true;

      lookupButton.textContent =
        "Buscando...";


      setStatus(
        "Consultando produto...",
        "success"
      );


      try {

        const endpoint =
          `/api/mercadolivre/product?url=${encodeURIComponent(link)}`;


        const response =
          await fetch(
            endpoint,
            {
              method:
                "GET",

              cache:
                "no-store",
            }
          );


        let data;


        try {

          data =
            await response.json();

        } catch {

          throw new Error(
            "Resposta inválida do servidor."
          );

        }


        if (
          !response.ok ||
          !data.success
        ) {

          throw new Error(
            data.error ||
            "Não foi possível buscar o produto."
          );

        }


        mercadoLivreData =
          data.product;


        document.getElementById(
          "product"
        ).value =
          data.product.title ||
          "";


        document.getElementById(
          "price"
        ).value =
          formatMoney(
            data.product.price
          );


        document.getElementById(
          "oldPrice"
        ).value =
          formatMoney(
            data.product.original_price
          );


        preencherCategoria(
          data.product.title
        );


        if (
          data.product.free_shipping
        ) {

          document.getElementById(
            "note"
          ).value =
            "Frete grátis";

        } else {

          document.getElementById(
            "note"
          ).value =
            "";

        }


        const preview =
          document.getElementById(
            "productPreview"
          );


        if (
          data.product.image
        ) {

          document.getElementById(
            "productImage"
          ).src =
            data.product.image;

        }


        document.getElementById(
          "productPreviewTitle"
        ).textContent =
          data.product.title ||
          "";


        document.getElementById(
          "productPreviewPrice"
        ).textContent =
          data.product.price
            ? `R$ ${formatMoney(
                data.product.price
              )}`
            : "";


        document.getElementById(
          "productPreviewDiscount"
        ).textContent =
          data.product
            .discount_percent
            ? `${data.product.discount_percent}% OFF`
            : "";


        preview.classList.add(
          "show"
        );


        setStatus(
          "✅ Produto encontrado e preenchido automaticamente.",
          "success"
        );


        /*
         * NOVO:
         * depois da busca,
         * já gera a postagem.
         */
        generateOffer();


        /*
         * Rola suavemente
         * para a mensagem pronta.
         */
        setTimeout(
          function () {

            document.getElementById(
              "messagePreview"
            ).scrollIntoView(
              {
                behavior:
                  "smooth",

                block:
                  "center",
              }
            );

          },
          250
        );

      } catch (
        error
      ) {

        console.error(
          "Erro Mercado Livre:",
          error
        );


        setStatus(
          error.message ||
          "Erro ao buscar produto.",
          "error"
        );

      } finally {

        lookupButton.disabled =
          false;

        lookupButton.textContent =
          "🔎 Buscar";

      }

    }


    function generateOffer() {

      const product =
        document
          .getElementById(
            "product"
          )
          .value
          .trim();


      const price =
        parseMoney(
          document
            .getElementById(
              "price"
            )
            .value
        );


      const oldPrice =
        parseMoney(
          document
            .getElementById(
              "oldPrice"
            )
            .value
        );


      const category =
        document
          .getElementById(
            "category"
          )
          .value;


      const coupon =
        document
          .getElementById(
            "coupon"
          )
          .value
          .trim();


      const note =
        document
          .getElementById(
            "note"
          )
          .value
          .trim();


      const link =
        platform === "meli"
          ? document
              .getElementById(
                "meliLink"
              )
              .value
              .trim()

          : document
              .getElementById(
                "amazonLink"
              )
              .value
              .trim();


      if (
        !product ||
        !price ||
        !link
      ) {

        return;

      }


      let discount =
        null;


      if (
        platform === "meli" &&
        mercadoLivreData &&
        mercadoLivreData
          .discount_percent
      ) {

        discount =
          mercadoLivreData
            .discount_percent;

      } else if (
        oldPrice &&
        oldPrice > price
      ) {

        discount =
          Math.round(
            (
              (
                oldPrice -
                price
              ) /
              oldPrice
            ) *
            100
          );

      }


      let categoryEmoji =
        "🔥";


      if (
        category ===
        "Celulares"
      ) {

        categoryEmoji =
          "📱";

      } else if (
        category ===
        "Informática"
      ) {

        categoryEmoji =
          "💻";

      } else if (
        category ===
        "Games"
      ) {

        categoryEmoji =
          "🎮";

      } else if (
        category ===
        "Casa e cozinha"
      ) {

        categoryEmoji =
          "🏠";

      } else if (
        category ===
        "Ferramentas"
      ) {

        categoryEmoji =
          "🛠️";

      } else if (
        category ===
        "Beleza"
      ) {

        categoryEmoji =
          "✨";

      } else if (
        category ===
        "Eletrônicos"
      ) {

        categoryEmoji =
          "⚡";

      }


      let message =
`🚨 *OFERTA TURBO* ⚡

${categoryEmoji} *${product}*`;


      if (
        discount
      ) {

        message +=
`\n\n🔥 *${discount}% OFF*`;

      }


      if (
        oldPrice
      ) {

        message +=
`\n\n❌ De: ~R$ ${formatMoney(
          oldPrice
        )}~`;

      }


      message +=
`\n✅ *Por apenas: R$ ${formatMoney(
        price
      )}*`;


      if (
        coupon
      ) {

        message +=
`\n\n🎟️ Cupom: *${coupon}*`;

      }


      if (
        note
      ) {

        if (
          note
            .toLowerCase()
            .includes(
              "frete"
            )
        ) {

          message +=
`\n\n🚚 *${note}*`;

        } else {

          message +=
`\n\n📌 ${note}`;

        }

      }


      message +=
`\n\n🛒 *PEGUE A OFERTA AQUI:*
${link}

⚡ *Oferta Turbo*
⏳ Preço e estoque podem mudar a qualquer momento.`;


      document.getElementById(
        "messagePreview"
      ).textContent =

      copyButton.classList.remove(

    async function copyMessage() {

      const text =
        document.getElementById(
          "messagePreview"
        ).textContent;


      try {

        await navigator
          .clipboard
          .writeText(
            text
          );


        const oldText =
          copyButton.textContent;


        copyButton.textContent =
          "✅ Copiado!";


        setTimeout(
          function () {

            copyButton.textContent =
              oldText;

          },
          1600
        );

      } catch {

        const textarea =
          document.createElement(
            "textarea"
          );


        textarea.value =
          text;

        textarea.style.position =
          "fixed";

        textarea.style.opacity =
          "0";


        document.body.appendChild(
          textarea
        );


        textarea.select();


        try {

          document.execCommand(
            "copy"
          );


          copyButton.textContent =
            "✅ Copiado!";


          setTimeout(
            function () {

              copyButton.textContent =
                "📋 Copiar mensagem";

            },
            1600
          );

        } catch {

          alert(
            "Não foi possível copiar automaticamente."
          );

        }


        textarea.remove();

      }

    }
